<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prep Notebook</title>
<meta name="description" content="Python for DSA and interview prep, from basics to advanced, with code you can run and step through.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="styles.css">
<script>try { const t = localStorage.getItem('prep-notebook.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<header class="top">
  <a href="#/" class="logo"><span aria-hidden="true">🐍</span> Prep Notebook</a>
  <nav class="top-nav" aria-label="Main">
    <a href="#/" data-nav="home">Learn</a>
    <a href="#/patterns" data-nav="patterns">Patterns</a>
    <a href="../">Tracker</a>
  </nav>
  <div class="top-tools">
    <button class="icon-btn" id="searchBtn" aria-label="Search lessons" title="Search (/)">⌕</button>
    <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark theme">◐</button>
    <button class="icon-btn" id="backupBtn" aria-label="Backup progress" title="Backup progress">⤓</button>
  </div>
</header>
<main id="view" class="view"></main>

<dialog id="searchDlg" class="search-dlg">
  <div class="search-box">
    <input id="searchInput" type="search" placeholder="Search every lesson…" aria-label="Search lessons" autocomplete="off">
    <ul id="searchResults" class="search-results"></ul>
  </div>
</dialog>

<dialog id="backupDlg">
  <form method="dialog" class="dlg">
    <h2>Backup progress</h2>
    <p>Progress is saved in this browser only. Copy this text somewhere safe, or paste a saved backup and choose Restore.</p>
    <textarea id="backupText" rows="8" spellcheck="false"></textarea>
    <div class="dlg-actions">
      <button type="button" id="restoreBtn" class="btn ghost">Restore</button>
      <button type="button" id="downloadBtn" class="btn ghost">Download</button>
      <button value="close" class="btn">Close</button>
    </div>
    <p id="backupMsg" class="muted" role="status"></p>
  </form>
</dialog>

<script src="vendor/codemirror/codemirror.js"></script>
<script src="vendor/codemirror/python.js"></script>
<script src="vendor/codemirror/javascript.js"></script>
<script src="vendor/codemirror/sql.js"></script>
<script src="vendor/codemirror/xml.js"></script>
<script src="vendor/codemirror/css.js"></script>
<script src="vendor/codemirror/htmlmixed.js"></script>
<script src="vendor/codemirror/matchbrackets.js"></script>
<script src="vendor/codemirror/runmode.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="content.js"></script>
<script src="patterns.js"></script>
<script src="app.js"></script>
</body>
</html>
