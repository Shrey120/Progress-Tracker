<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prep Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1218; --surface:#151B24; --surface-2:#1C2430; --surface-3:#232D3B;
    --line:#2A3644; --line-soft:#212B37;
    --text:#E7ECF3; --text-dim:#8E9AAC; --text-faint:#5F6B7C;
    --dsa:#F0883E; --dsa-soft:#3B2716;
    --prep:#3FB6A8; --prep-soft:#143029;
    --done:#4BA574; --miss:#C9524E;
    --easy:#5BBF7F; --med:#E0A040; --hard:#DD6560; --plain:#6B7C93;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--text);font-family:Inter,system-ui,sans-serif;
       font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .num{font-family:Sora,sans-serif;font-variant-numeric:tabular-nums}
  h1,h2,h3,h4{font-family:Sora,sans-serif;margin:0;font-weight:600}
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
    outline:2px solid var(--dsa);outline-offset:2px;border-radius:4px}
  input,textarea,select{font-family:inherit}
  code{font-family:ui-monospace,Menlo,monospace;font-size:.92em;color:var(--dsa)}

  .top{position:sticky;top:0;z-index:40;background:rgba(14,18,24,.94);
       backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
  .top-inner{max-width:1240px;margin:0 auto;padding:13px 20px 0;
             display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .daybox .big{font-size:22px;font-weight:700;line-height:1.1}
  .daybox .sub{font-size:11.5px;color:var(--text-dim);margin-top:1px}
  .rail{flex:1;min-width:170px;display:flex;align-items:center;gap:12px}
  .rail-track{position:relative;flex:1;height:9px;border-radius:99px;
              background:var(--surface-2);overflow:hidden}
  .rail-fill{position:absolute;inset:0 auto 0 0;border-radius:99px;
             background:linear-gradient(90deg,var(--dsa),#F5A55F);
             transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .ring{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;
        font-size:11.5px;font-weight:600;border:2px solid var(--dsa);color:var(--dsa);background:var(--ink)}
  .goal{display:flex;align-items:center;gap:10px}
  .goal-medal{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;
              border:2px solid #C9942F;background:#2A2113;font-size:18px}
  .streak{display:flex;align-items:center;gap:7px;background:var(--surface-2);
          border:1px solid var(--line);padding:6px 13px;border-radius:99px;font-size:12.5px;
          color:var(--text-dim)}

  .tabs{max-width:1240px;margin:0 auto;padding:10px 20px 0;display:flex;gap:4px;align-items:center}
  .tab{padding:11px 18px;font-size:13.5px;font-weight:500;color:var(--text-dim);
       border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--text)}
  .tab.on{color:var(--dsa);border-bottom-color:var(--dsa)}
  .tab-right{margin-left:auto;display:flex;gap:6px;padding-bottom:6px}
  .mini{font-size:12px;color:var(--text-dim);border:1px solid var(--line);
        padding:5px 11px;border-radius:7px}
  .mini:hover{background:var(--surface-2);color:var(--text)}

  .wrap{max-width:1240px;margin:0 auto;padding:22px 20px 80px}

  .today{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
         padding:14px 16px;margin-bottom:18px}
  .today-label{font-size:11.5px;color:var(--text-faint);margin-bottom:3px}
  .today-topics{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .today-topic-btn{font-family:Sora,sans-serif;font-weight:600;font-size:15px;color:var(--text);
    text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--text-faint)}
  .today-topic-btn:hover{text-decoration-color:var(--dsa);color:var(--dsa)}
  .today-sep{color:var(--text-faint)}
  .today-items{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .chip{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);
        background:var(--surface-2);color:var(--text-dim)}
  .chip.dsa{border-color:#5A3A1C;color:#E5A268;background:var(--dsa-soft)}
  .chip.prep{border-color:#1F4C45;color:#63C9BC;background:var(--prep-soft)}
  .chip:hover{border-color:var(--dsa);color:var(--text)}

  .toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .fbtn{font-size:12.5px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);
        color:var(--text-dim)}
  .fbtn.on{background:var(--surface-3);color:var(--text);border-color:var(--text-faint)}
  .search{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;
          padding:6px 11px;color:var(--text);font-size:13px;min-width:200px;margin-left:auto}
  .search::placeholder{color:var(--text-faint)}

  /* section (level 1) */
  .sec{margin-bottom:14px;border:1px solid var(--line-soft);border-radius:var(--radius);
       overflow:hidden;background:var(--surface);scroll-margin-top:150px}
  .sec.open{border-color:var(--line)}
  .sec-head{display:flex;align-items:center;gap:13px;padding:15px 17px;width:100%;text-align:left}
  .sec-head:hover{background:var(--surface-2)}
  .sec-bar{width:4px;align-self:stretch;border-radius:99px;flex:none;min-height:26px}
  .sec-bar.dsa{background:var(--dsa)} .sec-bar.prep{background:var(--prep)}
  .sec-name{flex:1;font-family:Sora,sans-serif;font-weight:600;font-size:15.5px}
  .sec-meta{display:flex;align-items:center;gap:13px;color:var(--text-dim);font-size:12.5px;
            white-space:nowrap}
  .sec-track{width:110px;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
  .sec-body{border-top:1px solid var(--line-soft);padding:8px 10px 10px}

  /* topic (level 2) */
  .mod{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:8px;
       margin-bottom:7px;overflow:hidden;scroll-margin-top:150px;
       transition:box-shadow .3s ease,border-color .3s ease}
  .mod:hover,.mod.open{border-color:var(--line)}
  .mod.flash{border-color:var(--dsa);box-shadow:0 0 0 3px rgba(240,136,62,.3)}
  .mod-head{display:flex;align-items:center;gap:11px;padding:11px 14px}
  .ringlet{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid var(--line);
           display:grid;place-items:center;font-size:9px;color:var(--ink)}
  .ringlet.part{border-color:var(--dsa)}
  .ringlet.full{background:var(--done);border-color:var(--done)}
  .mod-name{flex:1;font-size:13.5px;font-weight:500;text-align:left}
  .mod-count{color:var(--text-faint);font-weight:400;font-size:12.5px;margin-left:6px}
  .mod-dates{display:flex;align-items:center;gap:8px;color:var(--text-dim);
             font-size:12px;white-space:nowrap}
  .step{width:21px;height:21px;border-radius:50%;border:1px solid var(--line);
        display:grid;place-items:center;color:var(--text-dim);font-size:13px;line-height:1}
  .step:hover{background:var(--surface-3);color:var(--text)}
  .caret{color:var(--text-faint);transition:transform .2s;font-size:10px}
  .caret.up{transform:rotate(180deg)}
  .mod-body{border-top:1px solid var(--line-soft);padding:4px 0}

  /* problem (level 3) */
  .item{display:flex;align-items:center;gap:11px;padding:7px 14px 7px 34px;
        scroll-margin-top:150px;border-radius:6px;
        transition:box-shadow .3s ease,background .3s ease}
  .item:hover{background:var(--surface-3)}
  .item.flash{box-shadow:0 0 0 2px var(--dsa) inset;background:var(--surface-3)}
  .box{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);flex:none;
       display:grid;place-items:center;font-size:10px;color:var(--ink)}
  .box.done{background:var(--done);border-color:var(--done)}
  .box.prog{border-color:var(--dsa)}
  .box.prog::after{content:'';width:6px;height:6px;border-radius:2px;background:var(--dsa)}
  .item-title{flex:1;font-size:13px}
  .item.is-done .item-title{color:var(--text-faint);text-decoration:line-through}
  .item-due{font-size:10.5px;color:var(--text-faint);flex:none}
  .diff{font-size:10.5px;padding:2px 8px;border-radius:4px;flex:none;font-weight:500}
  .diff.Easy{background:#183025;color:var(--easy)}
  .diff.Medium{background:#33280F;color:var(--med)}
  .diff.Hard{background:#331A1A;color:var(--hard)}
  .icon{font-size:15px;color:var(--text-faint);flex:none;width:20px;line-height:1}
  .icon:hover{color:var(--miss)}
  .addrow{display:flex;gap:8px;padding:8px 14px 11px 34px}
  .addrow input{flex:1;background:var(--surface-3);border:1px solid var(--line);
                border-radius:6px;padding:6px 10px;color:var(--text);font-size:13px}
  .addrow select{background:var(--surface-3);border:1px solid var(--line);border-radius:6px;
                 padding:6px 8px;color:var(--text);font-size:13px}

  /* progress */
  .prog-top{display:grid;grid-template-columns:auto 1fr;gap:28px;
            background:var(--surface);border:1px solid var(--line);
            border-radius:var(--radius);padding:24px 26px;margin-bottom:18px;align-items:center}
  .donut{position:relative;width:190px;height:190px;flex:none}
  .donut svg{transform:rotate(-90deg)}
  .donut-mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .donut-mid .n{font-family:Sora,sans-serif;font-size:34px;font-weight:700;line-height:1.05}
  .donut-mid .of{font-size:12.5px;color:var(--text-faint)}
  .donut-mid .lab{font-size:11px;color:var(--text-faint);margin-top:5px}
  .bars{display:flex;flex-direction:column;gap:15px;min-width:0}
  .bar-row{display:flex;flex-direction:column;gap:6px}
  .bar-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
  .bar-name{color:var(--text-dim);display:flex;align-items:center;gap:7px}
  .bar-track{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}
  .bar-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
             gap:11px;margin-bottom:18px}
  .stat{background:var(--surface);border:1px solid var(--line-soft);
        border-radius:var(--radius);padding:15px 17px}
  .stat .v{font-family:Sora,sans-serif;font-size:23px;font-weight:700;line-height:1.15}
  .stat .k{font-size:12px;color:var(--text-faint);margin-top:3px}

  .topic-list{background:var(--surface);border:1px solid var(--line-soft);
              border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
  .topic-head{padding:13px 18px;border-bottom:1px solid var(--line-soft);
              font-family:Sora,sans-serif;font-weight:600;font-size:14px;
              display:flex;align-items:center;gap:11px}
  .topic-row{display:flex;align-items:center;gap:14px;padding:10px 18px;
             border-bottom:1px solid var(--line-soft)}
  .topic-row:last-child{border-bottom:none}
  .topic-row:hover{background:var(--surface-2)}
  .topic-name{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;
              white-space:nowrap;color:var(--text-dim)}
  .topic-bar{width:150px;height:6px;border-radius:99px;background:var(--surface-3);
             overflow:hidden;flex:none}
  .topic-n{width:58px;text-align:right;font-size:12.5px;color:var(--text-dim);flex:none}

  .kan{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
  .col{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius)}
  .col-head{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;
            font-family:Sora,sans-serif;font-weight:600;font-size:13.5px;border-radius:9px 9px 0 0}
  .col-head .n{background:rgba(0,0,0,.28);border-radius:99px;padding:1px 9px;
               font-size:12px;font-weight:500}
  .col-sub{padding:10px 15px 11px;font-size:11.5px;color:var(--text-faint);
           border-bottom:1px solid var(--line-soft)}
  .col.backlog .col-head{background:#3A2A1C;color:#E0B183}
  .col.progress .col-head{background:#1B3A5C;color:#95C6F0}
  .col.done .col-head{background:#1D3F2E;color:#84D2A6}
  .col-body{padding:11px;max-height:68vh;overflow-y:auto;display:flex;flex-direction:column;gap:9px}
  .card{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:9px;padding:12px 13px}
  .card:hover{border-color:var(--line)}
  .card-mod{font-size:11px;color:var(--text-faint)}
  .card-title{font-family:Sora,sans-serif;font-weight:600;font-size:13.5px;margin:3px 0 6px}
  .card-sub{font-size:12px;color:var(--text-dim);padding-bottom:9px;
            border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px}
  .card-foot{display:flex;align-items:center;justify-content:space-between;padding-top:9px;gap:8px}
  .card-due{font-size:11.5px;color:var(--text-faint)}
  .pill{font-size:11.5px;font-weight:500;padding:3px 11px;border-radius:99px;border:1px solid transparent}
  .pill.backlog{background:#3A2A1C;color:#E0B183;border-color:#523B26}
  .pill.progress{background:#1B3A5C;color:#95C6F0;border-color:#2C5580}
  .pill.done{background:#1D3F2E;color:#84D2A6;border-color:#2E6045}
  .empty{padding:44px 20px;text-align:center;color:var(--text-faint);font-size:13px}
  .more{text-align:center;color:var(--text-faint);font-size:12px;padding:8px;width:100%}
  .more:hover{color:var(--text)}

  .cal-bar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .cal-bar h2{font-size:17px}
  .legend{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--text-dim)}
  .nav{width:29px;height:29px;border-radius:7px;border:1px solid var(--line);
       display:grid;place-items:center;color:var(--text-dim)}
  .nav:hover{background:var(--surface-2);color:var(--text)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line-soft);
        border-radius:var(--radius);overflow:hidden}
  .dow{padding:9px 10px;font-size:11.5px;color:var(--text-faint);background:var(--surface);
       border-bottom:1px solid var(--line-soft)}
  .cell{min-height:104px;min-width:0;overflow:hidden;padding:8px;
        border-right:1px solid var(--line-soft);
        border-bottom:1px solid var(--line-soft);background:var(--surface)}
  .cell.blank{background:var(--ink)}
  .cell.today-cell{background:var(--surface-2)}
  .cell-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:7px}
  .daynum{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
          font-size:12px;font-weight:600;font-family:Sora,sans-serif;color:var(--text-dim)}
  .daynum.done{background:var(--done);color:#0B1F14}
  .daynum.miss{background:var(--miss);color:#22090A}
  .daynum.now{border:1.5px solid var(--dsa);color:var(--dsa)}
  .dayidx{font-size:10.5px;color:var(--text-faint)}
  .tag{display:block;width:100%;max-width:100%;box-sizing:border-box;
       font-size:10.5px;padding:2.5px 7px;border-radius:4px;margin-bottom:3px;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag.dsa{background:var(--dsa-soft);color:#E5A268}
  .tag.prep{background:var(--prep-soft);color:#63C9BC}
  .cnt{font-size:10.5px;color:var(--done);margin-top:2px}

  .scrim{position:fixed;inset:0;background:rgba(6,9,13,.74);z-index:90;
         display:grid;place-items:center;padding:20px;overflow-y:auto}
  .modal{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
         padding:26px;width:100%;max-width:400px;text-align:center}
  .modal.wide{max-width:680px;text-align:left}
  .modal h3{font-size:19px;margin-bottom:7px}
  .modal p{color:var(--text-dim);margin:0 0 16px;font-size:13.5px}
  .modal input[type=number],.modal textarea,.modal select{
    width:100%;padding:11px 13px;border-radius:8px;background:#141C27;
    border:1px solid #33465C;color:var(--text);font-size:14px;margin-bottom:14px}
  .modal textarea{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;
                  min-height:200px;resize:vertical;line-height:1.65}
  .modal input::placeholder,.modal textarea::placeholder{color:var(--text-faint)}
  .modal-btns{display:flex;gap:11px}
  .btn{flex:1;padding:11px;border-radius:8px;font-weight:600;font-size:14px}
  .btn.ghost{border:1px solid var(--line);color:var(--dsa)}
  .btn.ghost:hover{background:var(--surface-3)}
  .btn.solid{background:var(--dsa);color:#20140A}
  .btn.solid:hover{background:#F5A55F}
  .fmt{background:#101821;border:1px solid var(--line-soft);border-radius:8px;
       padding:12px 14px;font-family:ui-monospace,Menlo,monospace;font-size:12px;
       color:var(--text-dim);margin-bottom:14px;white-space:pre;overflow-x:auto;line-height:1.7}
  .row2{display:flex;gap:11px;margin-bottom:14px;flex-wrap:wrap}
  .row2 label{flex:1;min-width:180px;font-size:12.5px;color:var(--text-dim)}
  .row2 select{margin-bottom:0;margin-top:5px}

  .footer-note{margin-top:26px;padding-top:16px;border-top:1px solid var(--line-soft);
               color:var(--text-faint);font-size:12px;display:flex;gap:16px;flex-wrap:wrap}
  .linkish{color:var(--text-dim);text-decoration:underline;text-underline-offset:2px}
  .linkish:hover{color:var(--text)}

  @media (max-width:900px){
    .kan{grid-template-columns:1fr} .cell{min-height:78px}
    .prog-top{grid-template-columns:1fr;justify-items:center;gap:22px} .bars{width:100%}
    .sec-track{display:none}
  }
  @media (max-width:560px){
    .cell{min-height:60px;padding:5px} .tag,.cnt{display:none}
    .goal{display:none} .mod-dates .num{font-size:11px} .topic-bar{width:80px}
    .item-due{display:none}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script>
if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
  document.getElementById('root').innerHTML =
    '<div style="max-width:640px;margin:80px auto;padding:24px;border:1px solid #2A3644;' +
    'border-radius:10px;background:#151B24;font-family:Inter,system-ui,sans-serif">' +
    '<h2 style="font-family:Sora,sans-serif;margin:0 0 10px">React did not load</h2>' +
    '<p style="color:#8E9AAC;line-height:1.6">This page pulls React from unpkg.com. ' +
    'Check that you are online and that no ad blocker or network filter is blocking ' +
    'unpkg.com, then reload.</p></div>';
}
</script>

<script>
try {
const {
  useState,
  useEffect,
  useMemo,
  useCallback,
  useRef
} = React;

/* ---------- storage ---------- */
const KEY = 'prep-tracker-v3';
const store = {
  async get() {
    if (window.storage) {
      try {
        const r = await window.storage.get(KEY);
        return r ? JSON.parse(r.value) : null;
      } catch (e) {}
    }
    try {
      const v = localStorage.getItem(KEY);
      return v ? JSON.parse(v) : null;
    } catch (e) {
      return null;
    }
  },
  async set(d) {
    const s = JSON.stringify(d);
    if (window.storage) {
      try {
        await window.storage.set(KEY, s);
        return;
      } catch (e) {}
    }
    try {
      localStorage.setItem(KEY, s);
    } catch (e) {}
  }
};

/* ---------- dates ---------- */
const iso = d => {
  const z = new Date(d.getTime() - d.getTimezoneOffset() * 6e4);
  return z.toISOString().slice(0, 10);
};
const parse = s => {
  const p = s.split('-').map(Number);
  return new Date(p[0], p[1] - 1, p[2]);
};
const addDays = (s, n) => {
  const d = parse(s);
  d.setDate(d.getDate() + n);
  return iso(d);
};

const mkItem = (title, difficulty, est) => ({
  id: uid(),
  title,
  difficulty: difficulty || null,
  est: est || null,            /* estimated minutes */
  status: 'backlog',
  doneAt: null
});

/* ---------- time model ----------
   Every item carries an estimate in minutes. A topic's length is its total minutes divided
   by the minutes per day you give that track. Plan version bumps migrate saved plans. */
const PLAN_VERSION = 6;
const BUDGET_DEFAULT = { dsa: 80, prep: 40 };
const EST_DEFAULT = { dsa: { Easy: 20, Medium: 45, Hard: 75 }, prep: { Easy: 20, Medium: 35, Hard: 50 } };
const itemMinutes = (i, track) => i.est || (EST_DEFAULT[track] || EST_DEFAULT.dsa)[i.difficulty] || 30;
const moduleMinutes = m => m.items.reduce((s, i) => s + itemMinutes(i, m.track), 0);
const planDays = (m, budget) => Math.max(1, Math.ceil(moduleMinutes(m) / Math.max(10, (budget || BUDGET_DEFAULT)[m.track] || 60)));
const seedKey = (track, section, name) => [track, section || '', name].join('::').toLowerCase();

/* Bring a saved plan up to the current built-in plan without losing progress:
   matching topics keep their items, statuses, dates and extra days; items gain estimates;
   new built-in items and topics are added; custom topics are kept at the end of their track. */
function migratePlan(saved, budget) {
  const seeds = A2Z.concat(PREP);
  const byKey = {};
  saved.forEach(m => { byKey[seedKey(m.track, m.section, m.name)] = m; });
  const used = new Set();
  const out = seeds.map(sd => {
    const old = byKey[seedKey(sd.t, sd.s, sd.n)];
    const seedItems = sd.i.map(p => ({ title: p[0], difficulty: p[1], est: p[2] }));
    if (!old) {
      const m = { id: uid(), track: sd.t, section: sd.s, name: sd.n, start: null, days: 1, extra: 0, items: seedItems.map(p => mkItem(p.title, p.difficulty, p.est)) };
      return { ...m, days: planDays(m, budget) };
    }
    used.add(old);
    const norm = t => t.replace(/^★+\s*/, '').trim().toLowerCase();
    const est = {};
    seedItems.forEach(p => { est[norm(p.title)] = p; });
    const have = new Set(old.items.map(i => norm(i.title)));
    const items = old.items.map(i => {
      const p = est[norm(i.title)];
      return p ? { ...i, est: i.est || p.est, difficulty: i.difficulty || p.difficulty } : i;
    }).concat(seedItems.filter(p => !have.has(norm(p.title))).map(p => mkItem(p.title, p.difficulty, p.est)));
    const m = { ...old, items };
    return { ...m, days: planDays(m, budget) };
  });
  saved.forEach(m => { if (!used.has(m)) out.push(m); });   // custom topics
  return out;
}
function buildSeed(start) {
  const cur = {
    dsa: start,
    prep: start
  };
  return A2Z.concat(PREP).map(m => {
    const s = cur[m.t];
    cur[m.t] = addDays(s, m.d);
    return {
      id: uid(),
      track: m.t,
      section: m.s,
      name: m.n,
      start: s,
      days: m.d,
      extra: 0,
      items: m.i.map(p => mkItem(p[0], p[1], p[2]))
    };
  });
}
function reflow(mods, start) {
  const cur = {
    dsa: start,
    prep: start
  };
  return mods.map(m => {
    const s = cur[m.track];
    cur[m.track] = addDays(s, m.days + m.extra);
    return {
      ...m,
      start: s
    };
