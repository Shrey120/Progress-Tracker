<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Note · Prep Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<script>try { const t = localStorage.getItem('prep-notebook.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="tracker.css">
<style>
  .np{max-width:1040px;margin:0 auto;padding:26px clamp(16px,4vw,40px) 120px}
  .np-back{color:var(--text-3);text-decoration:none;font-size:14px}
  .np-back:hover{color:var(--text)}
  .np-crumb{font-size:14px;color:var(--text-3);margin-top:18px}
  .np-title{font:800 clamp(28px,4.4vw,42px)/1.1 var(--display);letter-spacing:-.02em;margin:4px 0 14px}
  .np-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
  .np-bar .note-pat{margin:0}
  .np-bar .grow{flex:1}
  .np .note-body{font-size:16.5px;line-height:1.7;padding:18px 20px;margin-bottom:18px}
  .np .media-list{gap:18px}
  .np .media .drawing{padding:10px}
  .np .media .drawing svg{max-height:none}
  .np-edit .note-field textarea{min-height:260px;font-size:16px;line-height:1.65;font-family:var(--sans);resize:vertical}
  .np-edit .note-field select{max-width:340px}
  .np-edit .note-field select,.np-edit .note-field textarea{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text)}
  .np-actions{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 0;margin-top:18px;
              background:linear-gradient(transparent,var(--bg) 30%)}
  .np-actions.static{position:static;background:none;margin-top:28px}
  .np-actions .btn{min-width:120px}
  .np-actions .btn:disabled{opacity:.5;cursor:default;filter:none}
  .np-saved{color:var(--green);font-size:14px}
  .np-empty{text-align:center;padding:60px 20px;color:var(--text-2);border:1px dashed var(--line-2);border-radius:var(--r)}
  .np-empty p{margin:0 0 16px}
  @media (max-width:620px){.np-actions .btn{flex:1}}
</style>
</head>
<body>
<header class="top">
  <a href="learn/#/" class="logo"><span aria-hidden="true">🐍</span> Prep Notebook</a>
  <nav class="top-nav" aria-label="Main">
    <a href="learn/#/">Learn</a>
    <a href="learn/#/patterns">Patterns</a>
    <a href="./">Tracker</a>
  </nav>
  <div class="top-tools">
    <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark theme" title="Light or dark">◐</button>
  </div>
</header>
<main class="np" id="page"><p class="muted">Loading the note…</p></main>
<script src="learn/patterns.js"></script>
<script src="note.js"></script>
</body>
</html>
